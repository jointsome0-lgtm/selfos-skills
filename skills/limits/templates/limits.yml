name: limits

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/limits.py <package>
      # The other two limiters live outside limits.py. pytest names the test
      # files that must be green, so a goal test can stay red while the code
      # it claims is still being built.
      # - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # - run: uv sync --frozen
      # - run: uv run ruff check . && uv run ruff format --check .
      # - run: uv run pytest tests/test_<one>.py tests/test_<two>.py
